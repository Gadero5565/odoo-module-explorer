name: Verify and package first release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install package builder
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Build bundled release wheel
        run: python scripts/build_release.py
      - name: Inspect wheel payload
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          wheel = next(Path('release').glob('*.whl'))
          with zipfile.ZipFile(wheel) as z:
              names = z.namelist()
              for expected in ('app/web_dist/index.html', 'app/vendor/typescript.js',
                               'app/vendor/LICENSE.txt', 'app/demo_addon/__manifest__.py',
                               'app/parsers/js_ast_bridge.cjs'):
                  assert any(n.endswith(expected) for n in names), expected
              assert any('/web_dist/assets/' in n and n.endswith('.js') for n in names)
          print('Wheel contains compiled UI, licensed parser and demo addon')
          PY
      - name: Install wheel into isolated environment
        run: |
          python -m venv /tmp/odoo-explorer-release-test
          /tmp/odoo-explorer-release-test/bin/pip install release/*.whl httpx
          cd /tmp
          /tmp/odoo-explorer-release-test/bin/odoo-explorer --version
          /tmp/odoo-explorer-release-test/bin/python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          with TestClient(app) as client:
              assert client.get('/').status_code == 200
              assert client.get('/api/health').json()['status'] == 'ok'
              demo = client.get('/api/config').json()['demo_module_path']
              assert demo
              assert client.post('/api/analyze', json={'module_path': demo}).status_code == 200
              resp = client.post('/api/javascript/inspect', json={
                  'module_path': demo,
                  'relative_path': 'static/src/components/calendar_widget/calendar_widget.js'
              })
              assert resp.status_code == 200, resp.text
          print('Installed wheel standalone smoke test successful')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: odoo-module-explorer-wheel
          path: release/*.whl
          if-no-files-found: error
