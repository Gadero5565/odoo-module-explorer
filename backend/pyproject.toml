[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-module-explorer-backend"
version = "0.1.0"
description = "Local static structure and Odoo semantics explorer for Odoo addons 16–19"
requires-python = ">=3.10"
license = "LGPL-3.0-only"
license-files = ["LICENSE", "LICENSES/GPL-3.0-only.txt"]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "lxml>=5.0,<7",
]

[project.scripts]
odoo-explorer = "app.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.7,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.parsers" = ["*.cjs"]
"app" = [
    "web_dist/*", "web_dist/assets/*",
    "vendor/typescript.js", "vendor/LICENSE.txt",
    "demo_addon/*", "demo_addon/controllers/*", "demo_addon/models/*",
    "demo_addon/views/*", "demo_addon/static/src/services/*",
    "demo_addon/static/src/components/calendar_widget/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
